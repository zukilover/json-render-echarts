name: Release

on:
  push:
    branches:
    - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Add permissions for OIDC and PR creation
    permissions:
      contents: write # To push changelog updates
      pull-requests: write # To create the "Version Packages" PR
      id-token: write # REQUIRED for Trusted Publishing (OIDC)

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci # 'ci' is safer/faster for CI than 'install'

    - name: Build Packages
      run: npm run build

    # This links package on npm back to this exact GitHub run
    - name: Configure npm for OIDC
      run: |
        echo "//registry.npmjs.org/:_authToken=" > .npmrc
        echo "registry=https://registry.npmjs.org/" >> .npmrc
        echo "provenance=true" >> .npmrc

    - name: Create Release Pull Request or Publish to npm
      id: changesets
      uses: changesets/action@v1
      with:
        # Use the script we added to package.json earlier
        publish: npm run release
        commit: "chore: version packages"
        title: "chore: version packages"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NODE_AUTH_TOKEN: ""
